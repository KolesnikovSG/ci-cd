stages:
  - build
  - test
  - deploy

variables:

  PROJECT_DIR: "/var/www"
  PRODUCTION_DIR: "${PROJECT_DIR}/app"
  STAGING_DIR: "${PROJECT_DIR}/staging"
  BACKEND_DIR: "Todo-back-main"
  FRONTEND_DIR: "Todo-front-main"
  PYTHON_VERSION: "3.10"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "test_db"
  DJANGO_SETTINGS_MODULE: "todoback.test_settings"


cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - venv/
    - ${BACKEND_DIR}/.cache/pip/

build_backend:
  stage: build
  only:
    - br1
  tags:
    - docker
  script:
    - apt-get update -y
    - apt-get install -y python${PYTHON_VERSION} python${PYTHON_VERSION}-venv python3-pip
    - python${PYTHON_VERSION} -m venv /venv
    - source /venv/bin/activate
    - pip install --upgrade pip
    - pip --version
    - cd ${BACKEND_DIR}
    - pip install -r requirements.txt pytest pytest-django psycopg2-binary
    - python manage.py collectstatic --noinput
    - cd ..
    - tar czf venv.tar.gz /venv
  artifacts:
    paths:
      - ${BACKEND_DIR}/
      - ${FRONTEND_DIR}/
      - venv.tar.gz
    expire_in: 1 week


test_backend:
  stage: test
  only:
    - br1
  tags:
    - docker
  services:
    - postgres:latest
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: ""
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgres://runner@postgres/test_db"
  script:
    - cd ${BACKEND_DIR}
    - apt-get update && apt-get install -y libpq-dev gcc python3-dev
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python manage.py migrate
    - pytest --junitxml=report.xml
  artifacts:
    reports:
      junit: ${BACKEND_DIR}/report.xml
    expire_in: 1 week





deploy_staging:
  stage: deploy
  only:
    - br1
  environment:
    name: staging
    url: http://$DEPLOY_HOST:8081
  before_script:
  - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
  - eval $(ssh-agent -s)
  - echo "$DEPLOY_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying backend to staging..."
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" ${BACKEND_DIR}/ $DEPLOY_USER@$DEPLOY_HOST:$STAGING_DIR/backend/
    - ssh $DEPLOY_USER@$DEPLOY_HOST "
      cd ${STAGING_DIR}/backend &&
      source venv/bin/activate &&
      pip install -r requirements.txt &&
      gunicorn -b 0.0.0.0:8081 todoback.wsgi:application --daemon &&
      sudo systemctl restart nginx
      "

deploy_production:
  stage: deploy
  only:
    - master
  when: manual
  environment:
    name: production
    url: http://$DEPLOY_HOST
  script:
    - echo "Deploying to production..."
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" ${BACKEND_DIR}/ $DEPLOY_USER@$DEPLOY_HOST:${PRODUCTION_DIR}/backend/
    - ssh $DEPLOY_USER@$DEPLOY_HOST "
      cd ${PRODUCTION_DIR}/backend &&
      source venv/bin/activate &&
      pip install -r requirements.txt &&
      sudo systemctl restart todo.service &&
      sudo systemctl restart nginx
      "