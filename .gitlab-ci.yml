stages:
  - build
  - test
  - deploy

variables:
  PROJECT_DIR: "/var/www"
  BACKEND_DIR: "Todo-back-main"
  FRONTEND_DIR: "Todo-front-main"
  PYTHON_VERSION: "3.10"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  PRODUCTION_DIR: "/var/www/production/"
  STAGING_DIR: "/var/www/staging/"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - ${BACKEND_DIR}/.cache

build_backend:
  stage: build
  tags:
    - docker
  script:
    - apt-get update && apt-get install -y python3-pip python3-venv
    - python3 -m pip install --upgrade pip
    - cd ${BACKEND_DIR}
    - pip install -r requirements.txt pytest pytest-django psycopg2-binary
    - python3 manage.py collectstatic --noinput
  artifacts:
    paths:
      - ${BACKEND_DIR}/
      - ${FRONTEND_DIR}/ 
    expire_in: 1 week

test_backend:
  stage: test
  needs: ["build_backend"]
  tags:
    - docker
  services:
    - name: postgres:14
      alias: postgres
      variables:
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "postgres"
        POSTGRES_DB: "test_db"
  variables:
    DB_HOST: "postgres" 
    DB_PORT: "5432"
    DB_NAME: "test_db"
    DB_USER: "postgres"
    DB_PASSWORD: "postgres"
    DJANGO_SETTINGS_MODULE: "todoback.test_settings"
  script:
    
    - apt-get update && apt-get install -y python3 python3-venv python3-pip
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r ${BACKEND_DIR}/requirements.txt
    - cd ${BACKEND_DIR}
    - python manage.py test todo.tests
    - mkdir -p test-reports
    - echo '<?xml version="1.0"?><testsuite></testsuite>' > test-reports/junit.xml
    - ls -la test-reports/
  artifacts:
    when: always
    paths:
      - ${BACKEND_DIR}/test-reports/junit.xml
    reports:
      junit: ${BACKEND_DIR}/test-reports/junit.xml
    expire_in: 1 week




deploy_staging:
  stage: deploy
  needs: ["test_backend"]
  only:
    - br1
  tags:
    - docker
  environment:
    name: staging
    url: http://82.202.139.13:8081
  before_script:
  - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y && apt-get install -y rsync)'
  - eval $(ssh-agent -s)
  - echo "$DEPLOY_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - ssh-keyscan 82.202.139.13 >> ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying backend to staging..."
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" ${BACKEND_DIR}/ $DEPLOY_USER@82.202.139.13:${STAGING_DIR}/backend/
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" ${FRONTEND_DIR}/ $DEPLOY_USER@82.202.139.13:${STAGING_DIR}/frontend/
    - ssh $DEPLOY_USER@82.202.139.13 "
        cd ${STAGING_DIR}/backend &&
        sudo apt-get update &&
        sudo apt-get install -y python3 python3-venv python3-pip &&
        python3 -m venv venv &&
        source venv/bin/activate &&
        pip install -r requirements.txt &&
        gunicorn -b 0.0.0.0:8081 todoback.wsgi:application --daemon &&
        sudo ln -sf /etc/nginx/sites-available/todo-staging.conf /etc/nginx/sites-enabled/ &&
        sudo systemctl enable todo-staging &&
        sudo systemctl start todo-staging &&
        sudo systemctl restart nginx
        "


deploy_production:
  stage: deploy
  only:
    - br1
  tags:
    - docker
  when: manual
  environment:
    name: production
    url: http://82.202.139.13
    before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y && apt-get install -y rsync)'
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan 82.202.139.13 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" ${BACKEND_DIR}/ $DEPLOY_USER@82.202.139.13:${PRODUCTION_DIR}/backend/
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" ${FRONTEND_DIR}/ $DEPLOY_USER@82.202.139.13:${PRODUCTION_DIR}/frontend/
    - ssh $DEPLOY_USER@82.202.139.13 "
      cd ${PRODUCTION_DIR}/backend &&
      source venv/bin/activate &&
      sudo pip install -r requirements.txt &&
      sudo ln -sf /etc/nginx/sites-available/todo-prod.conf /etc/nginx/sites-enabled/ &&
      sudo systemctl enable todo-prod &&
      sudo systemctl start todo-prod &&
      sudo systemctl restart todo.service &&
      sudo systemctl restart nginx
      "
